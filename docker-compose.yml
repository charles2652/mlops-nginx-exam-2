services:
  # -------------------------
  # Prometheus
  # -------------------------
  prometheus:
    image: prom/prometheus:latest
 #   container_name: prometheus_server
    ports:
      - "9090:9090"
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - nginx

  # -------------------------
  # Grafana
  # -------------------------
  grafana:
    image: grafana/grafana:latest
#    container_name: grafana_dashboard
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin

  # -------------------------
  # API v1 (standard) avec 3 réplicas
  # -------------------------
  api-v1:
    build:
      context: .
      dockerfile: src/api/v1/Dockerfile
    image: mlops-iris-api
    deploy:
      replicas: 3
    expose:
      - "8000"

  # -------------------------
  # API v2 (debug)
  # -------------------------
  api-v2:
    build:
      context: .
      dockerfile: src/api/v2/Dockerfile
    image: mlops-iris-api-debug
#    container_name: mlops-iris-api-debug
    expose:
      - "8000"

  # -------------------------
  # Nginx reverse proxy
  # -------------------------
  nginx:
    build:
      context: deployments/nginx/
      dockerfile: Dockerfile
    container_name: mlops-nginx-1
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ./deployments/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployments/nginx/certs:/etc/nginx/certs:ro
      - ./deployments/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - api-v1
      - api-v2

# -------------------------
# Volumes pour persistance
# -------------------------
volumes:
  prometheus_data:
  grafana_data:
